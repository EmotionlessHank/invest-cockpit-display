<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC Investment Cockpit</title>
<!-- iOS 主屏书签：图标走鉴权路由（未授权探测仍 404）；标题定主屏名。
     刻意不加 apple-mobile-web-app-capable——standalone 模式 cookie 仓独立于 Safari，会弄断设备 cookie 鉴权 -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 网页端标签栏 favicon：矢量优先（任意尺寸清晰），PNG 兜底老浏览器（Safari<15 不支持 svg favicon）。均走鉴权路由。 -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#1A1816; --card:#242019; --ink:#ECE7DB; --soft:#B5AE9E; --tert:#827B6B;
  --border:#35302A; --track:#322E27; --th-bg:#2A251E; --wait-bg:#322E27;
  --shadow:0 2px 12px rgba(0,0,0,.34); --shadow-sm:0 1px 5px rgba(0,0,0,.28);
  --green:#7FB04E; --blue:#85B7EB; --red:#E8675B; --amber:#EF9F27;
  --green-bg:#1C3A12; --green-fg:#AED389;
  --teal-bg:#0C3A30; --teal-fg:#7FD9BD;
  --amber-bg:#3A2A0E; --amber-fg:#F2C572;
  --red-bg:#3A1512; --red-fg:#F2A593;
  --rust-bg:#3A1A10; --rust-fg:#F0A98C;
  --grid:rgba(255,255,255,.06);
  --radius:14px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FAF7F0; --card:#FFFFFF; --ink:#2C2C2A; --soft:#5F5E5A; --tert:#9A9384;
  --border:#EBE5D7; --track:#EFEADF; --th-bg:#FCFAF4; --wait-bg:#F1EEE6;
  --shadow:0 1px 2px rgba(60,50,20,.05),0 1px 8px rgba(60,50,20,.04); --shadow-sm:0 1px 2px rgba(60,50,20,.05);
  --green:#3B6D11; --blue:#185FA5; --red:#E24B4A; --amber:#EF9F27;
  --green-bg:#EAF3DE; --green-fg:#27500A;
  --teal-bg:#E1F5EE; --teal-fg:#0F6E56;
  --amber-bg:#FAEEDA; --amber-fg:#854F0B;
  --red-bg:#FCEBEB; --red-fg:#791F1F;
  --rust-bg:#FAECE7; --rust-fg:#993C1D;
  --grid:rgba(0,0,0,.045);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
  padding:max(16px,env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom));transition:background .25s,color .25s}
.wrap{max-width:460px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 2px 14px}
.head h1{font-size:21px;font-weight:600;letter-spacing:-.3px}
.head .sub{font-size:12px;color:var(--tert);margin-top:3px}
.head .meta{text-align:right;font-size:12px;color:var(--tert)}
.tbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  color:var(--soft);font-size:15px;cursor:pointer;line-height:30px;text-align:center;box-shadow:var(--shadow-sm)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;margin-top:6px;background:var(--teal-bg);color:var(--teal-fg)}
.conn-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tert)}
.conn-dot.green{background:#3fb950;box-shadow:0 0 5px #3fb950;animation:cblink 1.4s ease-in-out infinite}
.conn-dot.red{background:#f85149;box-shadow:0 0 5px #f85149;animation:cblink .7s ease-in-out infinite}
.conn-dot.yellow{background:#d29922;box-shadow:0 0 5px #d29922}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:.2}}
.hr{height:1px;background:var(--border);margin:2px 0 16px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--tert);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.kpi .val{font-size:21px;font-weight:600;letter-spacing:-.4px}
.kpi .val.blue{color:var(--blue)}.kpi .val.red{color:var(--red)}.kpi .val.green{color:var(--green)}.kpi .val.amber{color:var(--amber)}
.kpi .sub{font-size:11px;color:var(--tert);margin-top:3px}
.sec{font-size:13px;font-weight:600;color:var(--soft);margin:22px 2px 11px;letter-spacing:.2px}
.ammo{background:var(--card);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm)}
.ammo .row{margin-bottom:13px}.ammo .row:last-child{margin-bottom:0}
.ammo .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;gap:8px}
.ammo .name{color:var(--ink);font-weight:500;white-space:nowrap}
.ammo .num{color:var(--soft);font-size:11px;white-space:nowrap}
.bar{height:7px;background:var(--track);border-radius:5px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:5px}
.chart-card{background:var(--card);border-radius:var(--radius);padding:14px 12px 10px;box-shadow:var(--shadow-sm)}
.cwrap{position:relative;height:300px}
.tbl{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.tbl-t th:nth-child(1),.tbl-t td:nth-child(1){width:36%}.tbl-t th:nth-child(2),.tbl-t td:nth-child(2){width:23%}
.tbl-t th:nth-child(3),.tbl-t td:nth-child(3){width:24%}.tbl-t th:nth-child(4),.tbl-t td:nth-child(4){width:17%}
.tbl-l th:nth-child(1),.tbl-l td:nth-child(1){width:18%}.tbl-l th:nth-child(2),.tbl-l td:nth-child(2){width:17%}
.tbl-l th:nth-child(3),.tbl-l td:nth-child(3){width:27%}.tbl-l th:nth-child(4),.tbl-l td:nth-child(4){width:23%}.tbl-l th:nth-child(5),.tbl-l td:nth-child(5){width:15%}
th{font-size:10.5px;font-weight:600;color:var(--tert);padding:10px 9px 7px;text-align:right;background:var(--th-bg)}
th:first-child{text-align:left}
td{padding:9px 9px;text-align:right;border-top:.5px solid var(--border);color:var(--ink)}
td:first-child{text-align:left;font-weight:500}
tr.now td{background:var(--th-bg)}
.tr-tier td{border-top:.5px solid var(--border)}
.leg td{font-size:10.5px;padding:3px 9px 3px;color:var(--soft);border-top:none}
/* 档位进度打卡：open 腿打卡按钮（替换 ○ 字符）。负 margin 抵掉放大的触达区，行高不变。
   选择器三级：压过下方 .leg .lic 的 width:14px/color（声明序在前，靠特异性取胜） */
.leg .lic.lic-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin:-9px 0 -9px -8px;
  border:0;border-radius:50%;background:transparent;color:var(--amber);font-size:14px;cursor:pointer;font-family:inherit;padding:0;vertical-align:middle}
.leg .lic.lic-btn:active{background:var(--track)}
.leg .lic.lic-btn:disabled{opacity:.4;cursor:default}
.leg td:first-child{padding-left:22px;font-weight:400}
.tbl-l .leg td:first-child{padding-left:10px;white-space:nowrap}   /* 账本列窄：定投逐笔行防折行 */
.leg .lic{display:inline-block;width:14px;color:var(--tert)}
.leg.f .lic{color:var(--green)}
.leg .lst{color:var(--tert);font-size:10px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px}
.p-done{background:var(--green-bg);color:var(--green-fg)}
.p-open{background:var(--amber-bg);color:var(--amber-fg)}
.p-wait{background:var(--wait-bg);color:var(--tert)}
.dim{color:var(--tert);font-weight:400;font-size:11px}
.oc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}   /* minmax(0,…)：列可收缩，nowrap 文字走 ellipsis 而非撑开 grid（H5 适配）*/
@media (max-width:480px){.oc{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.oc .card{padding:12px 11px}
.oc .card.tap{cursor:pointer}
.oc .lab{font-size:11px;color:var(--tert);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.oc .lab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .inf{flex:none;width:12px;height:12px;color:var(--tert);opacity:.7}
/* 指标解释抽屉 */
#sigSheet{max-height:82vh;overflow-y:auto}
.sig-status{font-size:13px;font-weight:600;margin:-4px 0 12px}
.sig-sec{margin-bottom:11px}
.sig-sec b{display:block;font-size:10.5px;color:var(--tert);font-weight:600;letter-spacing:.5px;margin-bottom:3px}
.sig-sec p{font-size:13px;line-height:1.6;margin:0}
.sig-foot{font-size:10.5px;color:var(--tert);margin-top:14px;text-align:center}
.oc .bar{margin-bottom:8px}
.oc .note{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .sub2{font-size:10px;color:var(--tert);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reso{background:linear-gradient(135deg,#3A2A0E,#4A350F);border:1.5px solid var(--amber);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:16px;font-size:13.5px;font-weight:600;color:var(--amber-fg);box-shadow:var(--shadow)}
:root[data-theme="light"] .reso{background:linear-gradient(135deg,#FAEEDA,#F7E3BC)}
.seg{display:flex;gap:4px;background:var(--track);border-radius:11px;padding:3px;margin:2px 0 0}
.seg button{flex:1;border:0;background:transparent;color:var(--soft);font-size:13px;font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer;font-family:inherit;transition:background .15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.mnavbar{position:relative;height:40px;border-radius:9px;overflow:hidden;display:flex}
.mnavbar .z{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.mnavbar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);box-shadow:0 0 0 2px var(--card)}
.mnavbar .mkd{position:absolute;top:-18px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap}
.mnavnote{font-size:11px;color:var(--tert);margin-top:14px;text-align:center}
.tbl-m th:nth-child(1),.tbl-m td:nth-child(1){width:17%}.tbl-m th:nth-child(2),.tbl-m td:nth-child(2){width:16%}
.tbl-m th:nth-child(3),.tbl-m td:nth-child(3){width:24%}.tbl-m th:nth-child(4),.tbl-m td:nth-child(4){width:15%}.tbl-m th:nth-child(5),.tbl-m td:nth-child(5){width:28%}
.tbl-x th:nth-child(1),.tbl-x td:nth-child(1){width:24%}.tbl-x th:nth-child(2),.tbl-x td:nth-child(2){width:56%}.tbl-x th:nth-child(3),.tbl-x td:nth-child(3){width:20%}
.lyr td:first-child{font-weight:600}
.act{background:var(--green-bg);border-radius:var(--radius);padding:14px 16px;margin-top:16px}
.act .l1{font-size:12px;color:var(--green-fg);opacity:.85}
.act .l2{font-size:15px;font-weight:600;color:var(--green-fg);margin-top:3px}
.act .l3{font-size:12.5px;color:var(--green-fg);margin-top:7px;opacity:.9}
.weekly{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--green);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.weekly.done,.weekly.skip{border-color:var(--border)}
.wcb{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--green);background:transparent;color:#fff;
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0;
  animation:wpulse 2s ease-in-out infinite}
.wcb:disabled{opacity:.5}
.wcb.on{background:var(--green);border-color:var(--green);animation:none;cursor:default}
.wcb.off{background:var(--track);border-color:var(--border);color:var(--tert);font-size:14px;animation:none;cursor:default}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 0 rgba(127,176,78,.4)}50%{box-shadow:0 0 0 8px rgba(127,176,78,0)}}
.weekly .wt1{font-size:11.5px;color:var(--tert)}
.weekly .wt2{font-size:16.5px;font-weight:600;letter-spacing:-.2px;margin-top:2px}
.weekly .wt2.green{color:var(--green)}
.weekly .wt3{font-size:11px;color:var(--tert);margin-top:3px}
.foot{text-align:center;font-size:10.5px;color:var(--tert);margin-top:20px;line-height:1.7}
.extra-card{background:var(--card);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow-sm)}
.extra-card .et{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin-bottom:9px}
.extra-card .et .tot{color:var(--teal-fg)}
.extra-card .ei{font-size:11.5px;color:var(--soft);display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:.5px solid var(--border)}
.extra-card .ei .src{color:var(--ink)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
  background:var(--green);color:#fff;border:0;border-radius:24px;padding:12px 18px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  max-width:460px;margin:0 auto;box-shadow:0 -4px 24px rgba(0,0,0,.34)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;margin-bottom:14px}
.sheet-h .x{cursor:pointer;color:var(--tert);font-size:19px;padding:2px 6px}
.seg2{display:flex;gap:5px;background:var(--track);border-radius:10px;padding:3px;margin-bottom:14px;flex-wrap:wrap}
.seg2 button{flex:1;border:0;background:transparent;color:var(--soft);font-size:12.5px;font-weight:600;padding:8px 4px;border-radius:7px;cursor:pointer;font-family:inherit;white-space:nowrap}
.seg2 button.on{background:var(--bg);color:var(--ink);box-shadow:var(--shadow-sm)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;color:var(--tert);margin-bottom:5px}
.fld input,.fld select{width:100%;background:var(--track);border:1px solid var(--border);border-radius:9px;
  padding:11px 12px;font-size:15px;color:var(--ink);font-family:inherit;-webkit-appearance:none}
.fld input::placeholder{color:var(--tert)}
.fld input[type=date]{min-height:47px;text-align:left}
.sheet-msg{font-size:12.5px;margin:4px 0 11px;min-height:16px;line-height:1.4}
.sheet-msg.err{color:var(--red)}.sheet-msg.ok{color:var(--green)}
.sheet-submit{width:100%;background:var(--green);color:#fff;border:0;border-radius:11px;padding:13px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.sheet-submit:disabled{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1 id="title">BTC Investment Plan</h1>
      <div class="sub" data-i18n="sub.readonly"></div>
      <span class="badge" id="badge">—</span>
    </div>
    <div class="meta">
      <span style="display:inline-flex;gap:6px">
        <button id="langBtn" class="tbtn" aria-label="Switch language"></button>
        <button id="themeBtn" class="tbtn" data-i18n-aria="aria.theme">☾</button>
      </span>
      <div id="updated" style="margin-top:9px">—</div>
      <div id="quote-time" style="margin-top:4px;opacity:.8">—</div>
    </div>
  </div>
  <div class="seg" id="seg"><button data-type="btc" class="on" data-i18n="seg.btc"></button><button data-type="mstr" data-i18n="seg.mstr"></button></div>
  <div class="hr"></div>
  <div id="view-btc">
  <div class="reso" id="reso" hidden></div>
  <div class="weekly" id="weekly" hidden></div>
  <div class="kpis" id="kpis"></div>
  <div class="sec" id="cycle-sec" hidden><span data-i18n="sec.cycle"></span> <span class="dim" style="font-weight:400" data-i18n="sec.cycle.hint"></span></div>
  <div class="kpis" id="cycle" hidden></div>
  <div class="sec" data-i18n="sec.budget"></div>
  <div class="ammo" id="ammo"></div>
  <div class="sec" id="extra-sec" hidden><span data-i18n="sec.extra"></span> <span class="dim" style="font-weight:400" data-i18n="sec.extra.hint"></span></div>
  <div class="extra-card" id="extra" hidden></div>
  <div class="sec" data-i18n="sec.chart"></div>
  <div class="chart-card"><div class="cwrap"><canvas id="chart"></canvas></div></div>
  <div class="sec"><span data-i18n="sec.tiers"></span> <span class="dim" style="font-weight:400" data-i18n="sec.tiers.hint"></span><span class="dim" id="rateNote" style="font-weight:400;float:right"></span></div>
  <div class="dim" id="frozenNote" hidden style="font-size:11px;margin:-4px 0 6px;color:var(--tert)"></div>
  <div class="tbl"><table class="tbl-t"><thead><tr><th data-i18n="th.tier_order"></th><th data-i18n="th.trigger_price"></th><th data-i18n="th.amount"></th><th data-i18n="th.progress"></th></tr></thead><tbody id="tiers"></tbody></table></div>
  <div class="sec"><span data-i18n="sec.onchain"></span> <span class="dim" style="font-weight:400" data-i18n="sec.onchain.hint"></span></div>
  <div class="oc" id="onchain"></div>
  <div class="act" id="action"></div>
  <div class="sec"><span data-i18n="sec.ledger"></span> <span class="dim" style="font-weight:400" data-i18n="sec.ledger.hint"></span></div>
  <div class="tbl"><table class="tbl-l"><thead><tr><th data-i18n="th.date"></th><th data-i18n="th.tier"></th><th data-i18n="th.fill_price"></th><th data-i18n="th.amount"></th><th data-i18n="th.approx_btc"></th></tr></thead><tbody id="ledger"></tbody></table></div>
  </div>

  <div id="view-mstr" hidden>
  <div class="weekly" id="m-weekly" hidden></div>
  <div class="kpis" id="m-kpis"></div>
  <div class="sec"><span data-i18n="sec.layers"></span> <span class="dim" style="font-weight:400" data-i18n="sec.layers.hint"></span></div>
  <div class="ammo" id="m-layers"></div>
  <div class="sec"><span data-i18n="sec.mnav_pos"></span> <span class="dim" style="font-weight:400" data-i18n="sec.mnav_pos.hint"></span></div>
  <div class="chart-card" style="padding:24px 14px 12px"><div class="mnavbar" id="m-mnav"></div><div class="mnavnote" id="m-mnavnote"></div></div>
  <div class="sec" id="m-trend-sec"><span data-i18n="sec.mnav_trend"></span> <span class="dim" style="font-weight:400" data-i18n="sec.mnav_trend.hint"></span></div>
  <div class="chart-card" id="m-trend-card"><div class="cwrap"><canvas id="m-trend"></canvas></div><div class="mnavnote" id="m-trendnote"></div></div>
  <div class="sec" id="m-chart-sec"><span data-i18n="sec.chart"></span> <span class="dim" style="font-weight:400" data-i18n="sec.mchart.hint"></span></div>
  <div class="chart-card" id="m-chart-card"><div class="cwrap"><canvas id="m-chart"></canvas></div></div>
  <div class="sec"><span data-i18n="sec.rounds"></span> <span class="dim" style="font-weight:400" data-i18n="sec.rounds.hint"></span></div>
  <div class="tbl"><table class="tbl-t"><thead><tr><th data-i18n="th.round_batch"></th><th data-i18n="th.trigger"></th><th data-i18n="th.amount"></th><th data-i18n="th.progress"></th></tr></thead><tbody id="m-rounds"></tbody></table></div>
  <div class="act" id="m-action"></div>

    const fills=tr.fills||[],plan=tr.plan||[];
    // 新 schema：plan 腿带 label+status（filled 显真实成交价/额，open 显挂单价）+ 不在 plan 的孤儿 fill。
    const planLabels=new Set(plan.map(p=>p.label));
    const fillByLabel={};fills.forEach(f=>{if(f.label!=null)fillByLabel[f.label]=f;});
    const legs=plan.map(p=>{const done=p.status==='filled';const f=fillByLabel[p.label];
      return{label:p.label,price:done&&f?f.price:p.price,rmb:done&&f?f.rmb:p.rmb,done,drift:FZD[p.label]};});
    fills.forEach(f=>{if(!planLabels.has(f.label))legs.push({label:f.label,price:f.price,rmb:f.rmb,done:true});});
    legs.sort((a,b)=>b.price-a.price);
    const nf=legs.filter(l=>l.done).length,nt=legs.length;
    const doneRmb=fills.reduce((s,f)=>s+f.rmb,0);
    const phase=(nf&&nf<nt)?'open':(nf?'done':tr.status);   // 部分 filled=部分(amber)
    const pcls=phase==='done'?'p-done':phase==='wait'?'p-wait':'p-open';
    const now=tr.name.startsWith(curT);
    const head=`<tr class="tr-tier ${now?'now':''}"><td>${tr.name}${now?' <span class="dim">'+t('tier.current')+'</span>':''}</td><td>$${tr.lo/1000}–${tr.hi/1000}K</td><td>${yuan(doneRmb)}<span class="dim"> / ¥${Math.round(tr.amount/1000)}K</span>${dimUsd(tr.amount)}</td><td><span class="pill ${pcls}">${nf}/${nt||'·'}</span></td></tr>`;
    const rows=legs.map(l=>{const ic=l.done?'✓':(tr.status==='wait'?'·':'○');const stt=l.done?t('leg.filled'):(tr.status==='wait'?t('leg.waiting'):t('leg.open'));
      const lab=l.label?`<span class="dim">${l.label}</span> `:'';
      const dr=(!l.done&&typeof l.drift==='number'&&Math.abs(l.drift)>=0.0001)?`<span class="lst" style="color:var(--tert)"> ${(l.drift*100>=0?'+':'')}${(l.drift*100).toFixed(1)}%</span>`:'';

      const tick=(!l.done&&tr.status!=='wait'&&l.label)
        ?`<button class="lic lic-btn" data-label="${l.label}" data-price="${l.price}" data-rmb="${l.rmb}" aria-label="${t('tier.tick_aria_a')}${l.label}${t('tier.tick_aria_b')}">○</button>`
        :`<span class="lic">${ic}</span>`;
      return `<tr class="leg ${l.done?'f':''}"><td>${tick}${lab}$${l.price.toLocaleString()}</td><td></td><td>${yuan(l.rmb)}${dimUsd(l.rmb)}</td><td><span class="lst">${stt}</span>${dr}</td></tr>`}).join('');
    return head+rows;
  }).join('');
  // 冻结触发价「上次更新」提示：有 frozen_at 则在抄底表上方标更新时间。
  {const fzEl=$('frozenNote');if(fzEl){fzEl.textContent=FZ.at?t('frozen.a')+(FZ.at||'').slice(5,16).replace('T',' ')+t('frozen.b'):'';fzEl.hidden=!FZ.at;}}

  // esc：note/sub 含外部 API 字符串（如 fng 的 value_classification），innerHTML 前必转义（评审 P2）
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  }).join('');
  // 大底双重确认共振徽章（④VDD 脉冲 + ⑤盈亏相交并发才亮，strategy.onchain_resonance 单一源）
  const rs=d.resonance||{};$('reso').hidden=!rs.active;if(rs.active)$('reso').textContent=rs.label;
  // 抄底档位动态触发价（合并展示）：主表「触发价」列经 app.py 叠加后即显示动态触发价，无独立卡片。
  renderWeekly(d.weekly);
  // 顶部已有本周定投卡 → 底部绿卡只留「下一关注」，不重复建议（老后端无 weekly 时回退原样式）
  if(d.weekly){$('action').hidden=!d.action.l3;$('action').innerHTML=d.action.l3?`<div class="l2">${d.action.l3}</div>`:'';}

  const lg=d.ledger||[];
  // 定投行：点击展开逐笔（dca_fills；逐笔化之前的累计额合并为「早期累计」一行）
  const dfills=d.dca_fills||[];

  const dcaLegs=(d.dca_used&&DCA_OPEN)?dfills.map(f=>`<tr class="leg f"><td><span class="lic">✓</span>${(f.at||'').slice(5,10)||'—'}</td><td></td><td class="dim">${t('dca.label')}</td><td>${yuan(f.rmb)}</td><td>${Number(f.btc).toFixed(4)}</td></tr>`).join('')
    +(d.dca_legacy>0?`<tr class="leg"><td><span class="lic">·</span>${t('dca.early')}</td><td></td><td class="dim">${t('dca.not_itemized')}</td><td>${yuan(d.dca_legacy)}</td><td><span class="lst">—</span></td></tr>`:''):'';
  $('ledger').innerHTML=(lg.length?lg.map(L=>`<tr><td class="dim">${(L.at||'').slice(5,10)||'—'}</td><td>${L.tier}</td><td>$${Number(L.price).toLocaleString()}</td><td>${yuan(L.rmb)}</td><td>${Number(L.btc).toFixed(4)}</td></tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--tert);padding:14px">${t('ledger.empty')}</td></tr>`)
    +dcaSum+dcaLegs;
  const dr=$('dcaRow'); if(dr)dr.onclick=()=>{DCA_OPEN=!DCA_OPEN;render(d);};

  drawChart('chart',d.chart,CHART_BTC);

async function completeWeekly(force){
  const w=(CACHE.btc||{}).weekly;
  if(!w||w.done_this_week||w.action!=='BUY')return;
  if(!force&&!confirm(t('confirm.weekly_a')+w.amount_rmb.toLocaleString()+t('confirm.weekly_b')))return;
  const sp=new URLSearchParams(location.search);
  const btn=$('wcb'); if(btn)btn.disabled=true;
  try{
    // X-Dash-Auth：设备 cookie 写路径的 CSRF 自定义 header；URL 凭据在时服务端优先走双因子
    const r=await fetch('/api/record',{method:'POST',headers:{'Content-Type':'application/json','X-Dash-Auth':'cookie'},
      body:JSON.stringify({kind:'dca',rmb:w.amount_rmb,token:sp.get('token')||'',code:sp.get('code')||'',force:!!force})});
    if(r.status===403||r.status===404){alert(t('alert.link_expired'));return;}
    const d=await r.json();
    if(d.ok){await load('btc');return;}
    if(/--force/.test(d.msg||'')&&!force){if(confirm((d.msg||'')+t('confirm.force')))return completeWeekly(true);return;}
    alert('⚠️ '+(d.msg||t('alert.record_failed')));
  }catch(e){alert(t('alert.network'));}
  finally{const b=$('wcb');if(b)b.disabled=false;}
}

// ───────── 周期时钟：潜在熊市低点（自估） + 下次减半倒计时（每日 cron 估算）─────────
function renderCycle(c){
  const sec=$('cycle-sec'),box=$('cycle');
  if(!c){sec.hidden=true;box.hidden=true;return;}   // 老后端无 cycle 字段 → 整节隐藏（向后兼容）
  const dayDiff=ds=>ds?Math.round((new Date(ds+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5):null;
  const bl=c.bear_low_date, bd=dayDiff(bl);
  const SE=t('cycle.self_est');
  const blSub=bd==null?SE:(bd>0?t('cycle.about')+bd+t('cycle.days_after')+' · '+SE:(bd===0?t('cycle.today')+' · '+SE:t('cycle.days_passed_a')+(-bd)+t('cycle.days_passed_b')+' · '+SE));
  const hv=c.halving;
  let hvVal=t('cycle.est_updating'), hvSub=t('cycle.weekly_auto');
  if(hv&&hv.est_date){
    hvVal=hv.est_date.replace(/-/g,'/');
    const hd=dayDiff(hv.est_date), parts=[];
    if(hd!=null)parts.push(t('cycle.about')+hd.toLocaleString()+t('cycle.days'));
    if(hv.blocks_remaining!=null)parts.push(t('cycle.blocks_a')+Number(hv.blocks_remaining).toLocaleString()+t('cycle.blocks_b'));   // null → 不渲染「余 null 块」
    if(hv.fetched_at)parts.push(t('cycle.asof')+String(hv.fetched_at).slice(5,10));                         // 冻结值时效标注
    hvSub=parts.join(' · ')||t('cycle.weekly_auto');
  }
  box.innerHTML=[
    [t('cycle.bear_low'), bl?bl.replace(/-/g,'/'):'—', blSub],
    [t('cycle.halving'), hvVal, hvSub],
  ].map(([l,v,s])=>`<div class="card kpi"><div class="lab">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`).join('');
  sec.hidden=false;box.hidden=false;
}

// mNAV 历史走势折线：阈值带 + 参考线 + 当前点高亮。口径同 saylortracker。
function drawMnavTrend(S){
  const id='m-trend';
  if(CHARTS[id]){CHARTS[id].destroy();delete CHARTS[id];}
  if(!S||!(S.points||[]).length)return;
  const pts=S.points,N=pts.length,data=pts.map(p=>p.mnav);
  const TERT=css('--tert'),GRID=css('--grid');
  const sem=s=>({bg:css('--'+s+'-bg'),fg:css('--'+s+'-fg')});
  const cur=S.current!=null?S.current:data[N-1];
  const ths=(S.thresholds||[]).map(t=>t.v);
  const vals=[...data,...ths,cur],lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*.08||.05;
  const ymin=Math.max(0,lo-pad),ymax=hi+pad,ann={};
  // 阈值带（相邻阈值之间底色，与位置条同色）
  const Z=[{hi:99,lo:1.0,sem:'teal'},{hi:1.0,lo:0.78,sem:'amber'},{hi:0.78,lo:0.65,sem:'green'},
           {hi:0.65,lo:0.55,sem:'red'},{hi:0.55,lo:0.40,sem:'rust'},{hi:0.40,lo:0,sem:'rust'}];
  Z.forEach((z,i)=>{if(z.lo>ymax||z.hi<ymin)return;

  // 阈值参考线 + 标签

  ann.cur={type:'point',xValue:N-1,yValue:cur,radius:4,backgroundColor:css('--green'),borderColor:css('--card'),borderWidth:2};
  ann.curl={type:'label',xValue:N-1,yValue:cur,yAdjust:-15,content:'▼'+cur.toFixed(2)+'x',backgroundColor:sem('green').bg,color:sem('green').fg,font:{size:10,weight:'700'},borderRadius:5,padding:{x:5,y:2},position:{x:'end'},xAdjust:-2};

    data:{labels:pts.map(p=>p.date),datasets:[{data,borderColor:css('--blue'),borderWidth:2,backgroundColor:'rgba(45,124,246,0.06)',fill:true,tension:.3,pointRadius:0}]},

        y:{min:ymin,max:ymax,grid:{color:GRID},border:{display:false},ticks:{color:TERT,font:{size:10},maxTicksLimit:6,callback:v=>(+v).toFixed(2)}}}}});

  const price=k.mstr?('$'+k.mstr.toLocaleString()):'—', mnav=k.mnav!=null?(k.mnav.toFixed(2)+'x'):'—';
  const avg=k.held_shares?('$'+k.avg_cost.toLocaleString()):'—';
  const pnl=(k.pnl_pct!=null)?((k.pnl_pct>=0?'+':'−')+Math.abs(k.pnl_pct)+'%'):t('mkpi.not_built');
  $('m-kpis').innerHTML=[
    [t('mkpi.held_shares'),k.held_shares+t('mkpi.shares_unit'),'',usd(k.invested)+' '+t('kpi.invested_suffix')],
    [t('kpi.avg_cost'),avg,k.held_shares?'':'',k.pnl_pct!=null?(pnl+t('mkpi.pnl_float')):t('mkpi.not_built')],
    [t('mkpi.mstr_spot')+' <span class="conn-dot '+CONN+'"></span>',price,'blue',t('mkpi.nav_per_share')+(k.nav_per_share?('$'+k.nav_per_share):'—')],
    [t('mkpi.cur_mnav'),mnav,mnavColor(k.mnav),d.badge.replace(/mNAV [0-9.]+x · /,'')],
  ].map(([l,v,c,s])=>`<div class="card kpi"><div class="lab">${l}</div><div class="val ${c}">${v}</div><div class="sub">${s}</div></div>`).join('');
  $('m-layers').innerHTML=d.layers.map(l=>{const p=l.budget?l.used/l.budget*100:0;
    return `<div class="row"><div class="top"><span class="name">${l.name}</span><span class="num">${usd(l.used)} / ${usd(l.budget)} · ${Math.round(p)}%</span></div><div class="bar"><span style="width:${p}%;background:var(${CVAR[l.sem]})"></span></div></div>`}).join('');
  buildMnavBar(d.mnav_bar);
  const hasT=!!(d.mnav_series&&(d.mnav_series.points||[]).length);   // mNAV 历史走势：取数失败整块隐藏
  $('m-trend-sec').hidden=!hasT;$('m-trend-card').hidden=!hasT;
  if(hasT){drawMnavTrend(d.mnav_series);
    $('m-trendnote').textContent=`${d.mnav_series.caliber}${t('mtrend.current_prefix')}${d.mnav_series.current!=null?d.mnav_series.current.toFixed(2):'—'}x`;}
  else if(CHARTS['m-trend']){CHARTS['m-trend'].destroy();delete CHARTS['m-trend'];}
  renderMstrWeekly(d.weekly);
  let html='',layer=null;
  d.rounds.forEach(r=>{
    if(r.layer!==layer){layer=r.layer;html+=`<tr class="lyr"><td colspan="4" style="background:var(--th-bg);color:var(--soft);font-size:10.5px;font-weight:600">${layer}</td></tr>`;}
    const fills=r.fills||[],plan=r.plan||[],sig=(r.signal||'').split('/')[0].replace('mNAV ','').trim();
    // 新 schema：plan 腿带 label+status（filled 显真实成交价/股，open 显挂单价/实时换算）+ 孤儿 fill。
    const planLabels=new Set(plan.map(b=>b.label));
    const fillByLabel={};fills.forEach(f=>{if(f.label!=null)fillByLabel[f.label]=f;});
    const legs=plan.map(b=>{const done=b.status==='filled';const f=fillByLabel[b.label];
      return{label:b.label,price:done&&f?f.price:(b.live_price||b.price),shares:done&&f?f.shares:b.shares,done};});
    fills.forEach(f=>{if(!planLabels.has(f.label))legs.push({label:f.label,price:f.price,shares:f.shares,done:true});});
    const nf=legs.filter(l=>l.done).length,nt=legs.length,star=r.sem==='green'?'⭐':'';
    const phase=(nf&&nf<nt)?'open':(nf?'done':r.status),pcls=phase==='done'?'p-done':phase==='wait'?'p-wait':'p-open';
    html+=`<tr class="tr-tier"><td>${r.id} ${r.name.split(' ').slice(1).join(' ')}${star}</td><td class="dim">${sig}</td><td>${uk(r.done_usd)}<span class="dim"> / ${uk(r.budget_usd)}</span></td><td><span class="pill ${pcls}">${nf}/${nt||'·'}</span></td></tr>`;
    legs.forEach(l=>{const ic=l.done?'✓':(r.status==='wait'?'·':'○'),stt=l.done?t('leg.filled'):(r.status==='wait'?t('leg.waiting'):t('leg.open'));
      html+=`<tr class="leg ${l.done?'f':''}"><td><span class="lic">${ic}</span>${l.label} $${l.price}</td><td class="dim">~${l.shares}${t('mkpi.shares_unit')}</td><td></td><td><span class="lst">${stt}</span></td></tr>`;});
  });
  $('m-rounds').innerHTML=html;
  $('m-action').innerHTML=`<div class="l1">${d.action.l1}</div><div class="l2">${d.action.l2}</div>${d.action.l3?`<div class="l3">${d.action.l3}</div>`:''}`;
  const lg=d.ledger||[];
  $('m-ledger').innerHTML=lg.length?lg.map(L=>`<tr><td class="dim">${(L.at||'').slice(5,10)||'—'}</td><td>${L.round}</td><td>$${L.price}</td><td>${(+L.shares).toLocaleString()}</td><td>${usd(L.usd)}</td></tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--tert);padding:14px">${t('ledger.empty')}</td></tr>`;
  $('m-exits').innerHTML=(d.exits||[]).map(x=>`<tr><td>${x.label}</td><td class="dim" style="text-align:left">${x.cond}</td><td>${x.pct}%</td></tr>`).join('');
  const hasC=!!(d.chart&&(d.chart.prices||[]).length);   // 行情取数失败 → 整块隐藏，不画空图
  $('m-chart-sec').hidden=!hasC;$('m-chart-card').hidden=!hasC;
  if(hasC)drawChart('m-chart',d.chart,CHART_MSTR);
  else if(CHARTS['m-chart']){CHARTS['m-chart'].destroy();delete CHARTS['m-chart'];}
}

// ───────── 视图切换 + 主题 ─────────
const root=document.documentElement,btn=$('themeBtn');
let CUR='btc',READY=false,CONN='yellow',FAILS=0,DCA_OPEN=false;
const CACHE={btc:SAMPLE,mstr:SAMPLE_MSTR};
function paint(){CUR==='btc'?render(CACHE.btc):renderMSTR(CACHE.mstr);}
function applyTheme(t){root.setAttribute('data-theme',t);btn.textContent=(t==='light'?'☀':'☾');localStorage.setItem('btc-theme',t);if(READY)paint();}
function show(type){CUR=type;localStorage.setItem('btc-view',type);
  $('view-btc').hidden=type!=='btc';$('view-mstr').hidden=type!=='mstr';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.type===type));
  $('title').textContent=type==='btc'?t('title.btc'):t('title.mstr');paint();if(READY)load(type);}
async function load(type){
  const cur=(type===CUR);                       // 灯只反映当前视图的数据源状态
  const sp=new URLSearchParams(location.search);
  const token=sp.get('token')||'', code=sp.get('code')||'';
  // 设备 cookie 进站：URL 无凭据时裸请求，浏览器同源自动带 __Host- cookie
  const q=token?`&token=${encodeURIComponent(token)}&code=${encodeURIComponent(code)}`:'';
  try{const r=await fetch(`/api/dashboard?type=${type}${q}`,{cache:'no-store'});
    if(r.ok){CACHE[type]=await r.json();if(cur){FAILS=0;setConn('green');paint();markQuote();}}
    else if(cur){onFail();}}catch(e){if(cur){onFail();}}
}
// 绿=刚更新成功 / 黄=偶发失败(连接不稳) / 红=连续失败(断开)
function onFail(){FAILS++;setConn(FAILS>=2?'red':'yellow');}
function setConn(s){CONN=s;document.querySelectorAll('.conn-dot').forEach(d=>{d.className='conn-dot '+s;});}
let LAST_QUOTE=null;
function renderQuote(){$('quote-time').textContent=LAST_QUOTE?t('quote.prefix')+LAST_QUOTE:t('quote.idle');}
function markQuote(){LAST_QUOTE=new Date().toLocaleTimeString(LANG==='zh'?'zh-CN':'en-GB',{hour12:false});renderQuote();}
applyStaticI18n();
applyTheme(localStorage.getItem('btc-theme')||'dark');
btn.onclick=()=>applyTheme(root.getAttribute('data-theme')==='light'?'dark':'light');
// 语言切换：切 LANG → 存储 → 更新 <html lang> + 静态文案 → 重渲当前视图（不刷新、保持 BTC/MSTR 选择）
$('langBtn').onclick=()=>{
  LANG=(LANG==='zh'?'en':'zh');
  localStorage.setItem('lang',LANG);
  SIG_INFO=SIG_INFO_ALL[LANG]||SIG_INFO_ALL.en;
  applyStaticI18n();
  $('title').textContent=CUR==='btc'?t('title.btc'):t('title.mstr');
  renderQuote();
  paint();
};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>show(b.dataset.type));
const qpType=new URLSearchParams(location.search).get('type');
show(qpType==='mstr'?'mstr':(localStorage.getItem('btc-view')||'btc'));
READY=true;
load('btc');load('mstr');
// 自动刷新：60s 轮询当前视图；后台标签暂停，切回前台立即刷一次
let POLL=null;
function startPoll(){stopPoll();POLL=setInterval(()=>{if(document.visibilityState==='visible')load(CUR);},60000);}
function stopPoll(){if(POLL){clearInterval(POLL);POLL=null;}}
document.addEventListener('visibilitychange',()=>{document.visibilityState==='visible'?(load(CUR),startPoll()):stopPoll();});
startPoll();

// ───────── 记一笔（写入口；token 走 body，不落 URL）─────────
// today() 定义已上移到脚本顶部（避免 renderCycle 首屏调用触发 TDZ）
const DATE_FLD={k:'date',label:'date.label',type:'date',opt:1};
// 买 BTC 改「下拉选计划腿」。腿清单**腿级过滤**（status=open，wait 档的 open 腿也收，守 D3；
// 评审 P2-2：禁止按档级 t.status 一刀切，否则 C1/C2 从下拉消失）。B3/C1/C2 价格是后端叠加的
// 冻结/动态触发价 → 文案用「≈$X 触发」不冒充静态计划价（评审 P3-1）。
const DYN_CODES_FE={B3:1,C1:1,C2:1};
function btcOpenLegs(){
  const out=[];
  (((CACHE.btc||{}).tiers)||[]).forEach(t=>{(t.plan||[]).forEach(p=>{
    if(p.status!=='filled'&&p.label)out.push({label:p.label,price:p.price,rmb:p.rmb,dyn:!!DYN_CODES_FE[p.label.split('-')[0]]});});});
  out.sort((a,b)=>b.price-a.price);
  return out;
}
const legOpts=()=>btcOpenLegs().map(l=>({v:l.label,
    t:`${l.label} · ${l.dyn?'≈':''}$${l.price.toLocaleString()}${l.dyn?t('leg.trigger_suffix'):''}${t('rec.leg_plan')}${l.rmb.toLocaleString()}`}))
  .concat([{v:'',t:t('leg.none')}]);   // D1 拍板：保留老路径入口，镜像 MSTR「不按轮次」
const REC={
  dca:{label:'rec.dca',fields:[{k:'rmb',label:'rec.amount_rmb',ph:'rec.ph.3000',type:'number'},{...DATE_FLD,label:'date.dca'}]},
  btc_fill:{label:'rec.btc_fill',fields:[
    {k:'label',label:'rec.leg',type:'select',opts:legOpts,opt:1},
    {k:'price',label:'rec.fill_price_btc',ph:'rec.ph.64000',type:'number'},
    {k:'amount',label:'rec.amount_opt',ph:'rec.ph.14000',type:'number',opt:1},
    {k:'unit',label:'rec.amount_unit',type:'select',opts:[{v:'rmb',t:'rec.unit_rmb'},{v:'usdt',t:'rec.unit_usdt'}],opt:1},
    DATE_FLD]},
  extra_fund:{label:'rec.extra_fund',fields:[{k:'rmb',label:'rec.amount_rmb',ph:'rec.ph.50000',type:'number'},{k:'source',label:'rec.source',ph:'rec.ph.source',type:'text'},{...DATE_FLD,label:'date.received'}]},
  mstr_fill:{label:'rec.mstr_fill',fields:[{k:'round',label:'rec.round',type:'select',opt:1,opts:[{v:'',t:'rec.round_none'},'T1','T2','A','B']},{k:'price',label:'rec.fill_price',ph:'rec.ph.91',type:'number'},{k:'shares',label:'rec.shares',ph:'rec.ph.30',type:'number',opt:1},DATE_FLD]},
};
let recType='dca';
const typesFor=()=>CUR==='btc'?['dca','btc_fill','extra_fund']:['mstr_fill'];
function renderRecTypes(){
  const ts=typesFor(); if(!ts.includes(recType))recType=ts[0];
  $('recTypes').innerHTML=ts.map(k=>`<button data-k="${k}" class="${k===recType?'on':''}">${t(REC[k].label)}</button>`).join('');
  $('recTypes').querySelectorAll('button').forEach(b=>b.onclick=()=>{recType=b.dataset.k;renderRecTypes();renderRecFields();setMsg('','');});
}
function renderRecFields(){
  $('recFields').innerHTML=REC[recType].fields.map(f=>f.type==='select'
    ? `<div class="fld"><label>${t(f.label)}</label><select id="f_${f.k}">${(typeof f.opts==='function'?f.opts():f.opts).map(o=>`<option value="${o.v??o}">${t(o.t??o)}</option>`).join('')}</select></div>`
    : f.type==='date'
    ? `<div class="fld"><label>${t(f.label)}</label><input id="f_${f.k}" type="date" value="${today()}" min="2020-01-01" max="${today()}"></div>`
    : `<div class="fld"><label>${t(f.label)}</label><input id="f_${f.k}" type="${f.type}" inputmode="${f.type==='number'?'decimal':'text'}" placeholder="${f.ph?t(f.ph):''}"></div>`
  ).join('');
  // 买 BTC 选腿联动——切腿即刷新成交价默认值与金额 placeholder（选「不按计划」清默认价）
  if(recType==='btc_fill'){
    const sel=$('f_label');
    const sync=()=>{const l=btcOpenLegs().find(x=>x.label===sel.value),pr=$('f_price'),am=$('f_amount');
      if(l){pr.value=l.price;am.placeholder=t('sync.blank_plan')+l.rmb.toLocaleString();}
      else{pr.value='';am.placeholder=t('sync.blank_match');}};
    if(sel){sel.onchange=sync;sync();}
  }
}
const setMsg=(t,c)=>{const m=$('recMsg');m.textContent=t;m.className='sheet-msg'+(c?' '+c:'');};
function openSheet(){renderRecTypes();renderRecFields();setMsg('','');$('sheetMask').hidden=false;$('sheet').hidden=false;}
function closeSheet(){$('sheetMask').hidden=true;$('sheet').hidden=true;}
async function submitRecord(force){
  const sp=new URLSearchParams(location.search);
  const body={kind:recType,token:sp.get('token')||'',code:sp.get('code')||'',force:!!force};
  for(const f of REC[recType].fields){const v=(($('f_'+f.k)||{}).value||'').trim();
    if(f.type==='date'&&v===today())continue;   // 选今天 = 不传 date，账本记真实时刻
    if(!v&&!f.opt){setMsg(t('submit.required_a')+t(f.label).replace(/[（(].*/,'')+t('submit.required_b'),'err');return;}
    if(v)body[f.k]=v;}
  // 金额单位映射——amount+unit → rmb 或 usdt（折算在脚本内按账本口径单点完成，前端绝不折算）
  if(recType==='btc_fill'){
    if(body.amount!=null){if(body.unit==='usdt')body.usdt=body.amount;else body.rmb=body.amount;}
    delete body.amount;delete body.unit;}
  $('recSubmit').disabled=true; setMsg(t('submit.recording'),'');
  try{
    const r=await fetch('/api/record',{method:'POST',headers:{'Content-Type':'application/json','X-Dash-Auth':'cookie'},body:JSON.stringify(body)});
    if(r.status===403||r.status===404){setMsg(t('alert.link_expired'),'err');$('recSubmit').disabled=false;return;}
    const d=await r.json();
    if(d.ok){setMsg('✅ '+(d.msg||t('submit.recorded')),'ok');setTimeout(()=>{closeSheet();load(CUR);},700);}
    else if(/--force/.test(d.msg||'')&&!force){
      if(confirm((d.msg||'')+t('confirm.force'))){return submitRecord(true);} setMsg('','');}
    else{setMsg('⚠️ '+(d.msg||t('alert.record_failed')),'err');}
  }catch(e){setMsg(t('alert.network'),'err');}
  $('recSubmit').disabled=false;
}
$('fab').onclick=openSheet; $('sheetClose').onclick=closeSheet; $('sheetMask').onclick=closeSheet;
// 档位进度 checkbox 一键记账。容器事件委托（腿行每次 paint 重建，绑容器不绑行）
$('tiers').addEventListener('click',e=>{const b=e.target.closest('.lic-btn');if(b&&!b.disabled)tickLeg(b,false);});
async function tickLeg(btn,force){
  // 快照纪律（评审 P1-3）：点击瞬间从 data-* 取定 label/价/额，confirm 与 POST 全程只用 snap
  const snap={label:btn.dataset.label,price:+btn.dataset.price,rmb:+btn.dataset.rmb};
  if(!snap.label||!(snap.price>0))return;
  if(!force&&!confirm(t('confirm.tick_a')+snap.label+t('confirm.tick_b')+snap.price.toLocaleString()+t('confirm.tick_c')+snap.rmb.toLocaleString()+t('confirm.tick_d')))return;
  btn.disabled=true;   // 提交期禁用（评审 P2-3）：POST 返回前不可再点，防双击撞防重弹错
  const sp=new URLSearchParams(location.search);
  try{
    const r=await fetch('/api/record',{method:'POST',headers:{'Content-Type':'application/json','X-Dash-Auth':'cookie'},
      body:JSON.stringify({kind:'btc_fill',label:snap.label,price:snap.price,token:sp.get('token')||'',code:sp.get('code')||'',force:!!force})});
    if(r.status===403||r.status===404){alert(t('alert.link_expired'));return;}
    const d=await r.json();
    if(d.ok){await load('btc');return;}
    if(/--force/.test(d.msg||'')&&!force){if(confirm((d.msg||'')+t('confirm.force')))return tickLeg(btn,true);return;}
    alert('⚠️ '+(d.msg||t('alert.record_failed')));
  }catch(e){alert(t('alert.network'));}
  finally{btn.disabled=false;}
}
// 指标解释弹层：onchain 容器事件委托（卡片每次 paint 重建，绑容器不绑卡）
const escSig=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openSig(k){
  const o=OC_CARDS.find(c=>sigKey(c)===k), i=SIG_INFO[k]; if(!o||!i) return;
  const neutral=o.sem==='wait'||!CVAR[o.sem];
  $('sigTitle').textContent=(o.icon?o.icon+' ':'')+o.name;
  $('sigStatus').innerHTML=`<span style="color:${neutral?'var(--soft)':`var(--${o.sem}-fg)`}">${escSig(o.note||'')}</span>${o.sub?` <span class="dim">· ${escSig(o.sub)}</span>`:''}`;
  $('sigBody').innerHTML=`<div class="sig-sec"><b>${t('sig.what')}</b><p>${i.what}</p></div><div class="sig-sec"><b>${t('sig.read')}</b><p>${i.read}</p></div><div class="sig-sec"><b>${t('sig.act')}</b><p>${i.act}</p></div>`;
  $('sigMask').hidden=false;$('sigSheet').hidden=false;
}
function closeSig(){$('sigMask').hidden=true;$('sigSheet').hidden=true;}
$('onchain').addEventListener('click',e=>{const c=e.target.closest('[data-sig]');if(c)openSig(c.dataset.sig);});
$('sigClose').onclick=closeSig; $('sigMask').onclick=closeSig;
$('recSubmit').onclick=()=>submitRecord(false);
$('fab').hidden=false;
</script>
